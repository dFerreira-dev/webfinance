services:
  mysql:
    image: mysql:8.4
    container_name: webfinance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: webfinance
      MYSQL_USER: webfinance
      MYSQL_PASSWORD: webfinance
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - webfinance_mysql_data:/var/lib/mysql

volumes:
  webfinance_mysql_data: